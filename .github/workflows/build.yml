name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: python3 tool/setup_platforms.py
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      # Signature de production : seulement si les secrets GitHub existent
      # (voir PLAY_STORE.md). Sinon l'APK est signé avec la clé de débogage.
      - name: Préparer la signature de production
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/android/upload-keystore.jks"
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" \
              "$GITHUB_WORKSPACE/android/upload-keystore.jks" > android/key.properties
            echo "Signature de production activée."
          else
            echo "::notice::Pas de clé de signature : build signé en mode débogage (non publiable sur Google Play)."
          fi

      - name: Compiler l'APK et l'AAB
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          PRIVACY_URL: ${{ vars.PRIVACY_URL }}
          DELETION_URL: ${{ vars.DELETION_URL }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
        run: |
          DEFINES="--dart-define=FIREBASE_API_KEY=$FIREBASE_API_KEY \
            --dart-define=FIREBASE_APP_ID=$FIREBASE_APP_ID \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID \
            --dart-define=FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID \
            --dart-define=PRIVACY_URL=$PRIVACY_URL \
            --dart-define=DELETION_URL=$DELETION_URL \
            --dart-define=SUPPORT_EMAIL=$SUPPORT_EMAIL"
          flutter build apk --release --build-number=${{ github.run_number }} $DEFINES
          if [ -f android/key.properties ]; then
            flutter build appbundle --release --build-number=${{ github.run_number }} $DEFINES
          else
            echo "::notice::AAB non produit : ajoutez les secrets de signature (voir PLAY_STORE.md)."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ryme-entretien-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ryme-entretien-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: python3 tool/setup_platforms.py
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
